// Code coverage (Kover). Measured over the testable layers only — ViewModels and
// data/domain logic. Compose UI, DI, generated (Hilt/Room/KSP) and theme are excluded
// because JVM unit tests can't exercise them; counting them would understate real coverage.
// Reports run on every build (gate-later); to enforce the 80% target, wire koverVerify*
// into CI once coverage reaches the bound.
kover {
    reports {
        filters {
            excludes {
                packages(
                    "com.mr.claudetraining.ui.theme",
                    "com.mr.claudetraining.ui.screens",
