// Code coverage (Kover). Measured over the layers JVM unit tests can actually exercise —
// ViewModels, pure repository logic (flow resilience, filtering, search), and DTO/Entity
// mappers. Excluded because plain unit tests can't drive them (counting them would just
// understate real coverage): Compose UI, DI, Hilt/Room/KSP-generated code, the theme, the
// Firebase-backed repositories and Room/sync/storage layers (covered by instrumented tests
// instead — see app/src/androidTest), and the mock-flavor test double FakeChatRepository.
// The 80% bound below is enforced in CI via :app:koverVerifyMockDebug.
kover {
    reports {
