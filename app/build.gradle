                    "*Hilt_*",
                    "hilt_aggregated_deps.*",
                    "dagger.hilt.*",
                    "*_Impl",
                    "*_Impl*"
                )
                annotatedBy("androidx.compose.runtime.Composable")
            }
        }
        verify {
