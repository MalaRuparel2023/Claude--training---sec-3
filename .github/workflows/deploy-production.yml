name: Deploy to Production

# Promotes a build to the Play Store **production** track.
#
# Manual approval gate: this job targets the `play-production` GitHub Environment,
# which must be configured with *Required reviewers* (Settings ▸ Environments ▸
# play-production). The job pauses at "Waiting for review" until a reviewer
# approves — nothing ships to production without a human click. See docs/CICD.md.
#
# Trigger options:
#   • Publishing a GitHub Release  → deploys that release's tag.
#   • Manual run (workflow_dispatch) → choose rollout fraction + tag.
#
# The internal-track deploy (continuous, no approval) lives in android-cicd.yml.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag or branch to deploy (e.g. v1.2)'
        required: true
        default: 'master'
      rollout:
        description: 'Staged rollout fraction (0.0–1.0; 1.0 = full release)'
        required: true
        default: '0.1'

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  JAVA_VERSION: '17'
  JAVA_DISTRIBUTION: temurin

jobs:
  # ── Re-run the quality gates against the exact ref being shipped ──────────
  verify:
    name: Verify quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Lint + unit tests + coverage gate
        run: |
          ./gradlew :app:lintMockDebug \
                    :domain:test :app:testMockDebugUnitTest \
                    :app:koverVerifyMockDebug --console=plain

  # ── Manual approval gate + production upload ─────────────────────────────
  deploy-production:
    name: Deploy to Play Store (production)
    needs: [verify]
    runs-on: ubuntu-latest
    # Approval gate: required reviewers on this environment block the job here.
    environment:
      name: play-production
      url: https://play.google.com/console
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build signed release bundle (prod)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:bundleProdRelease --console=plain

      - name: Upload to Play Store production track
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ro.alexmamo.firebasesigninwithemailandpassword
          releaseFiles: app/build/outputs/bundle/prodRelease/app-prod-release.aab
          track: production
          status: inProgress
          userFraction: ${{ github.event.inputs.rollout || '0.1' }}

      - name: Upload release bundle artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: app-prod-release-bundle
          path: app/build/outputs/bundle/prodRelease/*.aab
