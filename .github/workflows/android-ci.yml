name: Android CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests + coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests (mockDebug)
        run: ./gradlew :app:testMockDebugUnitTest --console=plain

      # Coverage is reported on every commit but not yet enforced (gate-later).
      # Target: 80% line coverage over ViewModels + data/domain logic.
      # To enforce, swap koverLog/koverXmlReport for :app:koverVerifyMockDebug.
      - name: Coverage report
        if: ${{ !cancelled() }}
        run: ./gradlew :app:koverLogMockDebug :app:koverXmlReportMockDebug :app:koverHtmlReportMockDebug --console=plain

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/build/reports/tests/

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            app/build/reports/kover/htmlMockDebug/
            app/build/reports/kover/reportMockDebug.xml
